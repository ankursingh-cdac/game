version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pawdoku-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pawdoku
    volumes:
      - pawdoku_mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawdoku-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/pawdoku
      - JWT_SECRET=pawdoku_production_secret_key_change_in_prod
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    depends_on:
      - mongodb

volumes:
  pawdoku_mongo_data:
